{{ define "main" }}
  <article class="page">
    <h1>{{ .Title }}</h1>
    {{ .Content }}
    {{ with .RegularPages }}
      <ul class="page-list">
        {{ range . }}
          <li>
            <a href="{{ .RelPermalink }}">{{ .Title }}</a>
            {{ with .Date }}<time datetime="{{ time.Format "2006-01-02" . }}">{{ time.Format "2 January 2006" . }}</time>{{ end }}
            {{ with .Summary }}<p>{{ . | plainify | truncate 180 }}</p>{{ end }}
          </li>
        {{ end }}
      </ul>
    {{ end }}
  </article>
{{ end }}
