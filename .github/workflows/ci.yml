name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]  # main is covered by deploy.yml
  workflow_dispatch:

jobs:
  build:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # for .Lastmod via git

      - name: Read .env
        id: env
        run: grep -E '^HUGO_VERSION=' .env >> "$GITHUB_OUTPUT"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ steps.env.outputs.HUGO_VERSION }}
          extended: true

      # --panicOnWarning is the point of this job: Hugo warns about a deprecation for a
      # release or two before it becomes a hard error. Treating warnings as failures is
      # what would have caught .Site.IsServer in 2023 instead of years later.
      - name: Build
        run: hugo --minify --gc --panicOnWarning
