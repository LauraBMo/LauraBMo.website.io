# Cloudflare Web Analytics. This is the *site token*, the one Cloudflare labels
# "for the beacon" — not the site tag (db18c92c…), which only the API uses, and not
# the deploy API token, which is a credential and must never appear here: everything
# in this file is baked into every published page.
#
# Blanking it disables analytics entirely. Emitted only in production builds —
# see layouts/_partials/analytics.html.
#
# Cloudflare's own auto-install must stay OFF, or every visit is counted twice.
cloudflareAnalyticsToken = "07c6bece738942be9a2abf2eed2231fb"

