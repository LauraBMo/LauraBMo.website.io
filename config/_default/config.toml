baseURL = "https://laurabmo.com/"
title = "L. Brustenga i Moncusí"
locale = "en"  # renamed from languageCode, deprecated in Hugo 0.158.0

enableEmoji = true
enableRobotsTXT = true

# Take each page's .Lastmod from the last git commit that touched its file, rather than
# falling back to the file's mtime. Without this, the footer's "Last updated" is the
# deploy date on CI — a checkout rewrites every mtime — and the local date on your disk,
# so the same page claims two different dates depending on where it was built. Both
# workflows already fetch full history (fetch-depth: 0) for exactly this.
enableGitInfo = true

disableKinds = ["taxonomy", "term"]

[permalinks]
  "/" = "/:contentbasename"

[markup.goldmark.renderer]
  unsafe = true  # allow raw HTML in markdown files

# LaTeX. Rendered to MathML at build time by layouts/_markup/render-passthrough.html
# (Hugo embeds KaTeX) — so no scripts, no webfonts, no CDN, nothing to load at runtime.
[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['\[', '\]'], ['$$', '$$']]
    inline = [['\(', '\)'], ['$', '$']]

# .Lastmod source order, and the order is the whole point: :fileModTime ahead of :git
# means the file's mtime always wins, and on a CI checkout that mtime is the checkout
# time — so every deploy stamped the current date on every page. :git first, taken from
# the last commit that touched the file (needs enableGitInfo above and the full-history
# checkout both workflows already do); :fileModTime stays as the fallback for a file not
# yet committed, which only ever happens locally.
[frontmatter]
  lastmod = [':git', 'lastmod', ':fileModTime', ':default']
