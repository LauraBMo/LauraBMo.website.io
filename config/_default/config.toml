baseURL = "https://laurabmo.com/"
title = "L. Brustenga i Moncusí"
locale = "en"  # renamed from languageCode, deprecated in Hugo 0.158.0

enableEmoji = true
enableRobotsTXT = true

# Take each page's .Lastmod from the last git commit that touched its file, rather than
# falling back to the file's mtime. Without this, the footer's "Last updated" is the
# deploy date on CI — a checkout rewrites every mtime — and the local date on your disk,
# so the same page claims two different dates depending on where it was built. Both
# workflows already fetch full history (fetch-depth: 0) for exactly this.
enableGitInfo = true

disableKinds = ["taxonomy", "term"]

[permalinks]
  "/" = "/:contentbasename"

[markup.goldmark.renderer]
  unsafe = true  # allow raw HTML in markdown files

# LaTeX. Rendered to MathML at build time by layouts/_markup/render-passthrough.html
# (Hugo embeds KaTeX) — so no scripts, no webfonts, no CDN, nothing to load at runtime.
[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['\[', '\]'], ['$$', '$$']]
    inline = [['\(', '\)'], ['$', '$']]

[frontmatter]
  lastmod = ['lastmod', ':fileModTime', ':default']
